name: GWA Tracker

concurrency:
  group: gwa-tracker
  cancel-in-progress: false

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "22,52 * * * *"
  workflow_dispatch:

jobs:
  check-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Determine batch
        id: batch
        run: |
          if [ "${{ github.event.schedule }}" == "7,37 * * * *" ]; then
            echo "batch=A" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" == "22,52 * * * *" ]; then
            echo "batch=B" >> $GITHUB_OUTPUT
          else
            echo "batch=ALL" >> $GITHUB_OUTPUT
          fi

      - name: Run tracker
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BATCH: ${{ steps.batch.outputs.batch }}
        run: python tracker.py
        continue-on-error: true

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_*.png
          if-no-files-found: ignore

      - name: Commit updated tracking files
        run: |
          git config user.name "gwa-tracker-bot"
          git config user.email "actions@github.com"
          git add seen_posts.json subscribers.json last_update_id.txt session_state.json
          git commit -m "Update tracking state" || echo "No changes to commit"
          git pull --rebase origin main
          git push
