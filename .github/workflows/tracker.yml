name: GWA Tracker

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        env:
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python tracker.py
        continue-on-error: true

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_*.png
          if-no-files-found: ignore

      - name: Commit updated tracking files
        run: |
          git config user.name "gwa-tracker-bot"
          git config user.email "actions@github.com"
          git add seen_posts.json subscribers.json last_update_id.txt
          git commit -m "Update tracking state" || echo "No changes to commit"
          git pull --rebase origin main
          git push
